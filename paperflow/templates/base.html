<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paperflow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">P</span>
      <span><strong>Paperflow</strong><small>本地论文工作台</small></span>
    </a>
    <div class="agent-pill {{ 'ok' if agent_available else 'muted' }}">
      <span class="status-dot"></span>{{ agent_reason }}
    </div>
  </header>
  <main class="shell">
    {% if message %}<div class="notice success">{{ message }}</div>{% endif %}
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>

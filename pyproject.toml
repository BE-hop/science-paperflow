[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-paperflow"
version = "0.2.0"
description = "Local-first portfolio workflow for multilingual SCI manuscripts"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.24", "pytest>=7.0"]

[project.scripts]
paperflow = "paperflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["paperflow*"]

[tool.setuptools.package-data]
paperflow = ["templates/*.html", "static/*.css", "static/*.js"]
